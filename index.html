<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js biglietto del treno</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>

<body>
    <main class="container">
        <nav class="navbar">
            <div class="container">
                <a class="navbar-brand" href="#">
                    <img src="assets/primary_logo_2020.png" alt="train-logo" height="50px" class="d-inline-block align-text-top">
                </a>
            </div>
        </nav>
  
        <form>
            <div class="container-form row">
                <span class="col-6">
                <i class="bi bi-person-fill"></i>
                </span>
                <span class="user-name col-6">
                    <label for="floatingInputValue">Nome Passeggero</label>
                    <input type="text" class="form-control" placeholder="Mario Rossi">
                </span>
            </div>

            <div class="container-calculator row">
                <div class="row">
                    <div class="input">
                        <span class="col-6">
                        <i class="bi bi-geo-alt-fill"></i>
                        </span>
                        <span class="col-6">
                        <label for="km">Km da percorrere</label>
                        <input type="number" id="km" required class="form-control" placeholder="100">
                        </span>
                    </div>
                </div>
                <div class="row">
                    <div class="input">
                        <span class="col-6">
                        <i class="bi bi-calendar-fill"></i>
                        </span>
                        <span class="col-6">
                        <label for="age">Età del passeggero</label>
                        <input type="number" id="age" required class="form-control" placeholder="16">
                        </span>
                    </div>
                    </div>
                </div>
            </div>
            <button id="button" class="btn" type="submit">Calcola prezzo</button>
        </form>

        <div id="print-ticket"></div>
        
        <div class="save-botton">
            <button id="add-wallet-btn" class="btn" type="button">Add to wallet</button>
            <button id="download-pdf-btn" class="btn-grey" type="button">Download PDF</button>
        </div>
    </main>
</body>
</html>
